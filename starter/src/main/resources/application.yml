spring:
  datasource:
    url: jdbc:mysql://localhost:3306/backend_labs?useSSL=false&allowPublicKeyRetrieval=true
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
